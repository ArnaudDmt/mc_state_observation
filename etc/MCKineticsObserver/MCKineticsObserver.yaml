# gains for the Valinor Observer in backup in case of Kinetics divergence
filterGains:
  finalAlpha: 5
  finalBeta: 1
  finalGamma: 2

leggedOdometry:
  kappa: 10
  lambdaInf: 0.001
  correctContacts: true
  odometryType: None

backupInterval: 1

ekfStateProcessVariances:
  statePositionInitVariance: [0.0,0.0,0.0]
  stateOriInitVariance: [1e-4, 1e-4, 0.0]
  stateLinVelInitVariance: [1e-6,1e-6,1e-6]
  stateAngVelInitVariance: [1e-6,1e-6,1e-6]
  gyroBiasInitVariance: [1e-8,1e-8,1e-8]
  unmodeledForceInitVariance: [100,100,100]
  unmodeledTorqueInitVariance: [100,100,100]

  contactPositionInitVarianceFirstContacts: [5e-6,5e-6,2e-6]
  contactOriInitVarianceFirstContacts: [2e-4,2e-4,2e-4]
  contactForceInitVarianceFirstContacts: [400,400,400]
  contactTorqueInitVarianceFirstContacts: [100.0,100.0,100.0]

  contactPositionInitVarianceNewContacts: [5e-6,5e-6,2e-6]
  contactOriInitVarianceNewContacts: [2e-4,2e-4,2e-4]
  contactForceInitVarianceNewContacts: [0.5,0.5,0.5]
  contactTorqueInitVarianceNewContacts: [9e-4,9e-4,9e-4]

  statePositionProcessVariance: [1e-9, 1e-9, 1e-9]
  stateOriProcessVariance: [1e-11, 1e-11, 1e-11]
  stateLinVelProcessVariance: [1e-8, 1e-8, 1e-8]
  stateAngVelProcessVariance: [1e-10, 1e-10, 1e-10]
  gyroBiasProcessVariance: [1e-18,1e-18,1e-18]
  unmodeledForceProcessVariance: [9e-2, 9e-2, 9e-2]
  unmodeledTorqueProcessVariance: [9e-2, 9e-2, 9e-2]
  contactPositionProcessVariance: [1e-5,1e-5,1e-9]
  contactOrientationProcessVariance: [1e-8,1e-8,1e-4]
  contactForceProcessVariance: [900,900,900]
  contactTorqueProcessVariance: [225,225,225]

contacts:
  contactsDetection: Surfaces
  surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
  schmittTriggerLowerPropThreshold: 0.1
  schmittTriggerUpperPropThreshold: 0.12
