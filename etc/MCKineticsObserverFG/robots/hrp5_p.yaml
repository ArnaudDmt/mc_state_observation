# Per-axis standard deviations, square roots of the variances of
# etc/MCKineticsObserver/robots/hrp5_p.yaml, so both estimators see the same sensor uncertainty.
sensorNoises:
  gyroNoise: [5e-4, 5e-4, 5e-4] # gyroSensorVariance [2.5e-7, 2.5e-7, 2.5e-7]
  acceleroNoise: [5e-2, 5e-2, 5e-2] # acceleroSensorVariance [2.5e-3, 2.5e-3, 2.5e-3]
  forceNoise: [0.7, 0.7, 0.7] # forceSensorVariance [5e-1, 5e-1, 5e-1]
  momentNoise: [3e-2, 3e-2, 3e-2] # torqueSensorVariance [9e-4, 9e-4, 9e-4]

contacts:
  linStiffness: [3e5, 3e5, 3e5]
  angStiffness: [1000, 1000, 1000]
  linDamping: [150, 150, 150]
  angDamping: [17, 17, 17]
