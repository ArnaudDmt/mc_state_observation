ObserverModulePaths: ["$<TARGET_FILE_DIR:MCKineticsObserverFG>"]
ObserverPipelines:
  name: MainObserverPipeline
  gui: false
  observers:
    - type: MCKineticsObserverFG
      update: true
      config:
        withDebugLogs: false
        withGui: false

        leggedOdometry:
          odometryType: Flat
          withRestPoseAverageFactor: true

        contacts:
          contactsDetection: Surfaces
          surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
          schmittTriggerLowerPropThreshold: 0.11
          schmittTriggerUpperPropThreshold: 0.12
          linStiffness: [3e4, 3e4, 3e4]
          angStiffness: [727, 727, 727]
          linDamping: [150, 150, 150]
          angDamping: [17, 17, 17]

        stateInitNoises:
          posNoise: 1e-6
          oriNoise: [1e-4, 1e-4, 0.0]
          linVelNoise: [1e-6, 1e-6, 1e-6]
          angVelNoise: 1e-6
          linAccNoise: 1e-3
          angAccNoise: 1e-3
          disturbForceNoise: 1.0
          disturbMomentNoise: 1.0
          gyroBiasNoise: 1e-8
          contactRestPosAverageNoise: 1e-6
          contactRestYawAverageNoise: 1e-6
          restPosNoise: [1e-6, 1e-6, 5e-7]
          restOriNoise: [1e-6, 1e-6, 1e-5]
          forceNoise: 400.0
          momentNoise: 100.0

        stateInitNoisesFirstContacts:
          restPosNoise: [1e-4, 1e-4, 5e-5]
          restOriNoise: 1e-4
          forceNoise: 20.0
          momentNoise: 10.0

        stateProcessNoises:
          posNoise: 1e-10
          oriNoise: 1e-12
          linVelNoise: 1e-10
          angVelNoise: 1e-10
          linAccNoise: 1e-6
          angAccNoise: 1e-6
          disturbForceNoise: 9e-2
          disturbMomentNoise: 5e-2
          gyroBiasNoise: 1e-12
          restPosNoise: [3.16228e-3, 3.16228e-3, 3.16228e-5]
          restOriNoise: [1e-4, 1e-4, 1e-2]
          forceNoise: 250.0
          momentNoise: 250.0

        sensorNoises:
          acceleroNoise: [1e-4, 1e-4, 1e-4]
          gyroNoise: 1e-6
          forceNoise: 20.0
          momentNoise: 1.5

        jointTorques:
          enabled: false
          noise: 10.0
